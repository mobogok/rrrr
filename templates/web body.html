<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2>
    
    <form action="/" method="POST">
        <input type="number" name="number_1" step="any" required>
        
        <select name="category">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        
        <input type="number" name="number_2" step="any" required>
        
        <button type="submit">Calculate</button>
    </form>

    <!-- ถ้ามีผลลัพธ์ ให้แสดงตรงนี้ -->
    {% if result is not none %}
        <h3>Result: {{ result }}</h3>
    {% endif %}
</body>
</html>
